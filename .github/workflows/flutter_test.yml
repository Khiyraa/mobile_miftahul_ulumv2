name: Flutter Unit Tests

on:
  push:
    branches:
      - main
      - master
      - revisi-minorv2
  pull_request:
    branches:
      - main
      - master
      - revisi-minorv2

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Create .env file
        run: echo "API_URL=http://localhost" > .env

      - name: Run Unit Tests
        run: flutter test
